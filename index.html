<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Kost</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://google.com" async defer></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #1e293b; overflow-x: hidden; }
    
    /* Layout Transitions */
    #sidebar { transition: transform 0.3s ease-in-out; }
    #main-content { transition: margin-left 0.3s ease-in-out; }
    
    /* Glass Inputs */
    .input-box { background: white; border: 1px solid #cbd5e1; border-radius: 0.75rem; padding: 0.75rem 1rem; width: 100%; font-size: 0.875rem; transition: border-color 0.2s; }
    .input-box:focus { outline: none; border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1); }
    
    /* Animations */
    .view-section { display: none; opacity: 0; animation: fadeIn 0.4s forwards; }
    .view-section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    /* Custom Scrollbar for Sidebar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    
    .menu-item { transition: all 0.2s; }
    .menu-item:hover, .menu-item.active-menu { background: rgba(255,255,255,0.1); border-left: 4px solid #0ea5e9; color: #38bdf8; }
  </style>
</head>
<body class="h-screen flex overflow-hidden">

  <!-- AUTH PAGE -->
  <div id="authPage" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm">
      <h1 class="text-2xl font-extrabold text-center text-slate-800 mb-6">Login Kost</h1>
      <form id="authForm" onsubmit="handleLogin(event)">
        <div class="mb-4">
          <label class="block text-xs font-bold text-slate-500 mb-1">Username</label>
          <input type="text" id="loginUser" required class="input-box bg-slate-50">
        </div>
        <div class="mb-6 relative">
          <label class="block text-xs font-bold text-slate-500 mb-1">Password</label>
          <input type="password" id="loginPass" required class="input-box bg-slate-50 pr-10">
        </div>
        <button type="submit" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition">Masuk</button>
      </form>
    </div>
  </div>

  <!-- SIDEBAR (Bilah Kiri) -->
  <aside id="sidebar" class="bg-[#0f172a] text-slate-300 w-64 flex-shrink-0 h-full fixed md:relative z-40 transform -translate-x-full md:translate-x-0 shadow-2xl flex flex-col">
    <div class="p-6 flex items-center justify-between border-b border-slate-700">
      <h2 class="text-xl font-extrabold text-white tracking-wide"><i class="fas fa-building text-sky-500 mr-2"></i>Kost<span class="text-sky-500">Hub</span></h2>
      <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
    </div>
    
    <div class="flex-grow py-4 flex flex-col gap-2">
      <!-- Menu 2: Dashboard (Dipindah ke atas agar jadi halaman pertama) -->
      <button onclick="switchMenu('dashboard')" id="menu-dashboard" class="menu-item active-menu w-full text-left px-6 py-3 font-semibold text-sm flex items-center gap-3">
        <i class="fas fa-chart-area text-lg w-6"></i> Total & Grafik
      </button>
      <!-- Menu 1: Input Revenue -->
      <button onclick="switchMenu('revenue')" id="menu-revenue" class="menu-item w-full text-left px-6 py-3 font-semibold text-sm flex items-center gap-3">
        <i class="fas fa-file-invoice-dollar text-lg w-6"></i> Input Revenue
      </button>
      <!-- Menu 3: Maintenance -->
      <button onclick="switchMenu('maintenance')" id="menu-maintenance" class="menu-item w-full text-left px-6 py-3 font-semibold text-sm flex items-center gap-3">
        <i class="fas fa-tools text-lg w-6"></i> Anggaran Perbaikan
      </button>
      <!-- Menu 4: Account -->
      <button onclick="switchMenu('account')" id="menu-account" class="menu-item w-full text-left px-6 py-3 font-semibold text-sm flex items-center gap-3">
        <i class="fas fa-user-cog text-lg w-6"></i> Akun & Setting
      </button>
    </div>

    <div class="p-4 border-t border-slate-700">
      <button onclick="logout()" class="w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 py-2 rounded-lg text-sm font-bold transition flex justify-center items-center gap-2">
        <i class="fas fa-sign-out-alt"></i> Keluar
      </button>
    </div>
  </aside>

  <!-- Overlay untuk Mobile -->
  <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden md:hidden"></div>

  <!-- MAIN CONTENT (Bilah Kanan) -->
  <main class="flex-1 h-full overflow-y-auto flex flex-col relative w-full">
    
    <!-- Navbar Atas -->
    <header class="bg-white shadow-sm px-4 py-3 flex items-center justify-between sticky top-0 z-20">
      <button onclick="toggleSidebar()" class="text-slate-600 p-2 rounded hover:bg-slate-100"><i class="fas fa-bars text-xl"></i></button>
      <div class="flex items-center gap-3">
        <div class="text-right hidden sm:block">
          <p class="text-xs text-slate-500">Admin Aktif</p>
          <p class="text-sm font-bold text-slate-800" id="displayUser">User</p>
        </div>
        <div class="w-9 h-9 rounded-full bg-sky-100 text-sky-600 flex items-center justify-center font-bold border border-sky-200">
          <i class="fas fa-user"></i>
        </div>
      </div>
    </header>

    <!-- CONTENT SECTIONS -->
    <div class="p-4 sm:p-6 pb-24 max-w-5xl mx-auto w-full">
      
      <!-- VIEW: DASHBOARD & GRAFIK -->
      <div id="view-dashboard" class="view-section active">
        <h2 class="text-2xl font-bold text-slate-800 mb-6">Dasbor Pendapatan</h2>
        
        <!-- Filter Card -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 mb-6 flex flex-wrap gap-4 items-end">
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1">Bulan</label>
            <select id="filterMonth" class="input-box bg-slate-50 min-w-[120px]">
              <option value="1">Januari</option> <option value="2">Februari</option>
              <option value="3">Maret</option> <option value="4">April</option>
              <option value="5">Mei</option> <option value="6">Juni</option>
              <option value="7">Juli</option> <option value="8">Agustus</option>
              <option value="9">September</option> <option value="10">Oktober</option>
              <option value="11">November</option> <option value="12">Desember</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1">Tahun</label>
            <input type="number" id="filterYear" class="input-box bg-slate-50 w-24">
          </div>
          <button onclick="loadDashboard()" class="bg-sky-600 hover:bg-sky-700 text-white font-bold py-2 px-4 rounded-xl transition">
            <i class="fas fa-filter mr-1"></i> Filter
          </button>
        </div>

        <!-- Total Card -->
        <div class="bg-gradient-to-r from-sky-600 to-indigo-600 rounded-3xl p-6 text-white shadow-lg mb-6 relative overflow-hidden">
          <div class="relative z-10">
            <p class="text-sky-100 text-sm font-semibold mb-1">Total Pendapatan Bulan Ini</p>
            <h3 class="text-4xl font-extrabold" id="dashTotal">Rp 0</h3>
          </div>
          <i class="fas fa-wallet absolute -right-4 -bottom-4 text-7xl text-white opacity-20"></i>
        </div>

        <!-- Chart Container -->
        <div class="bg-white p-4 sm:p-6 rounded-3xl shadow-sm border border-slate-100">
          <h3 class="text-sm font-bold text-slate-500 mb-4">Grafik Pertumbuhan</h3>
          <div class="w-full h-64">
            <canvas id="revenueChart"></canvas>
          </div>
        </div>
      </div>

      <!-- VIEW: INPUT REVENUE -->
      <div id="view-revenue" class="view-section">
        <h2 class="text-2xl font-bold text-slate-800 mb-6">Input Revenue Kost</h2>
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
          <form onsubmit="submitRevenue(event)" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">Tanggal</label>
                <input type="date" id="revDate" required class="input-box">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">Nomor Kamar</label>
                <input type="text" id="revRoom" required placeholder="Cth: A1" class="input-box">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">Nama Pengontrak</label>
                <input type="text" id="revTenant" required placeholder="Nama lengkap" class="input-box">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">Kategori</label>
                <select id="revCategory" required class="input-box">
                  <option value="Bulanan">Bulanan</option>
                  <option value="Tahunan">Tahunan</option>
                </select>
              </div>
              <div class="md:col-span-2">
                <label class="block text-xs font-bold text-slate-500 mb-1">Jumlah Biaya (Rp)</label>
                <input type="number" id="revAmount" required placeholder="Tanpa titik/koma" class="input-box text-lg font-bold text-sky-700">
              </div>
              <div class="md:col-span-2">
                <label class="block text-xs font-bold text-slate-500 mb-1">Catatan</label>
                <textarea id="revNote" rows="2" class="input-box"></textarea>
              </div>
            </div>
            <button type="submit" class="w-full mt-4 bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-xl transition flex justify-center items-center gap-2">
              <i class="fas fa-save"></i> Simpan Pendapatan
            </button>
          </form>
        </div>
      </div>

      <!-- VIEW: MAINTENANCE -->
      <div id="view-maintenance" class="view-section">
        <h2 class="text-2xl font-bold text-slate-800 mb-6">Rencana Anggaran Perbaikan</h2>
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
          <form onsubmit="submitMaintenance(event)" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">Nomor Kamar / Area</label>
                <input type="text" id="mRoom" required placeholder="Cth: Dapur atau A2" class="input-box">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">Bahan / Pekerjaan</label>
                <input type="text" id="mMaterial" required placeholder="Cth: Cat Tembok, Keran Air" class="input-box">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">Harga Satuan (Rp)</label>
                <input type="number" id="mPrice" required oninput="calcTotal()" class="input-box">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">Total Barang</label>
                <input type="number" id="mQty" required oninput="calcTotal()" value="1" min="1" class="input-box">
              </div>
            </div>
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 mt-4 flex justify-between items-center">
              <span class="text-sm font-bold text-slate-500">Total Anggaran:</span>
              <span class="text-2xl font-extrabold text-red-500" id="mTotalDisplay">Rp 0</span>
              <input type="hidden" id="mTotalValue" value="0">
            </div>
            <button type="submit" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition flex justify-center items-center gap-2">
              <i class="fas fa-clipboard-check"></i> Simpan Anggaran
            </button>
          </form>
        </div>
      </div>

      <!-- VIEW: ACCOUNT -->
      <div id="view-account" class="view-section">
        <h2 class="text-2xl font-bold text-slate-800 mb-6">Pengaturan Akun</h2>
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 max-w-md">
          <form onsubmit="updateAccount(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1">Username Baru</label>
              <input type="text" id="accUser" class="input-box" placeholder="Biarkan kosong jika tidak diubah">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1">Password Baru</label>
              <input type="password" id="accPass" class="input-box" placeholder="Biarkan kosong jika tidak diubah">
            </div>
            <button type="submit" class="w-full mt-4 bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition">
              Perbarui Akun
            </button>
          </form>
        </div>
      </div>

    </div>
  </main>

  <script>

    // Ganti dengan URL hasil "Publish to web" (format CSV) milik Anda
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRHPtO48w817ATC_PRm_d6Jj1gay3PJ8RiRMzk2E2AU14z0cSMdRXimHtA_cvSX5YuEHWPBBBBX0pgk/pub?output=csv';
        async function ambilData() {
            try {
                const response = await fetch(SHEET_URL);
                const dataTeks = await response.text();
                
                // Mengubah teks CSV menjadi baris-baris data
                const baris = dataTeks.split("\n");
                const headers = baris[0].split(",");
                
                let htmlKonten = "<ul>";
                
                // Looping dari baris kedua (indeks 1) karena baris pertama adalah Header
                for (let i = 1; i < baris.length; i++) {
                    if (baris[i].trim() === "") continue; // Lewati baris kosong
                    
                    const kolom = baris[i].split(",");
                    // Contoh: mengambil kolom pertama (nama) dan kolom kedua (harga)
                    htmlKonten += `<li><strong>${kolom[0]}</strong> - Rp ${kolom[1]}</li>`;
                }
                
                htmlKonten += "</ul>";
                document.getElementById("data-container").innerHTML = htmlKonten;
                
            } catch (error) {
                console.error("Gagal memuat data:", error);
                document.getElementById("data-container").innerHTML = "Gagal memuat data.";
            }
        }

        ambilData();
    
    let currentUser = null;
    let myChart = null;

    // Inisialisasi Filter Bulan & Tahun saat ini
    const d = new Date();
    document.getElementById('filterMonth').value = d.getMonth() + 1;
    document.getElementById('filterYear').value = d.getFullYear();
    document.getElementById('revDate').valueAsDate = d;

    // --- NAVIGASI & UI ---
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      if(sidebar.classList.contains('-translate-x-full')) {
        sidebar.classList.remove('-translate-x-full');
        overlay.classList.remove('hidden');
      } else {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
      }
    }

    function switchMenu(viewId) {
      // Ubah tampilan
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.getElementById('view-' + viewId).classList.add('active');
      
      // Ubah warna aktif di sidebar
      document.querySelectorAll('.menu-item').forEach(el => {
        el.classList.remove('active-menu');
        el.classList.remove('text-sky-400');
        el.classList.add('text-slate-300');
      });
      const activeBtn = document.getElementById('menu-' + viewId);
      activeBtn.classList.add('active-menu');
      activeBtn.classList.remove('text-slate-300');
      
      // Tutup sidebar di HP
      if(window.innerWidth < 768) toggleSidebar();
      
      // Jika masuk dashboard, load data grafik
      if(viewId === 'dashboard') loadDashboard();
    }

    // --- FORMAT KURS ---
    function formatRp(angka) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
    }

    // --- AUTENTIKASI ---
    function handleLogin(e) {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.innerText = "Memproses...";
      
      google.script.run.withSuccessHandler(res => {
        btn.innerText = "Masuk";
        if (res.success) {
          currentUser = res;
          document.getElementById('displayUser').innerText = res.username;
          document.getElementById('accUser').value = res.username;
          document.getElementById('authPage').style.display = 'none';
          loadDashboard(); // Load chart
        } else alert(res.message);
      }).loginUser(document.getElementById('loginUser').value, document.getElementById('loginPass').value);
    }

    function logout() {
      currentUser = null;
      document.getElementById('authPage').style.display = 'flex';
      document.getElementById('authForm').reset();
    }

    // --- MENU 1: REVENUE ---
    function submitRevenue(e) {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Menyimpan...`;
      
      const v = id => document.getElementById(id).value;
      google.script.run.withSuccessHandler(res => {
        btn.innerHTML = `<i class="fas fa-save"></i> Simpan Pendapatan`;
        alert(res.message);
        e.target.reset();
        document.getElementById('revDate').valueAsDate = new Date();
      }).addRevenue(currentUser.userId, v('revDate'), v('revRoom'), v('revTenant'), v('revCategory'), v('revAmount'), v('revNote'));
    }

    // --- MENU 2: DASHBOARD & GRAFIK ---
    function loadDashboard() {
      if(!currentUser) return;
      document.getElementById('dashTotal').innerHTML = `<i class="fas fa-spinner fa-spin text-2xl"></i>`;
      
      const m = document.getElementById('filterMonth').value;
      const y = document.getElementById('filterYear').value;

      google.script.run.withSuccessHandler(res => {
        document.getElementById('dashTotal').innerText = formatRp(res.total);
        renderChart(res.chartData, m, y);
      }).getDashboardData(currentUser.userId, m, y);
    }

    function renderChart(dataObj, month, year) {
      const ctx = document.getElementById('revenueChart').getContext('2d');
      if(myChart) myChart.destroy(); // Hapus grafik lama

      // Menyiapkan array label (tanggal 1-31)
      const daysInMonth = new Date(year, month, 0).getDate();
      let labels = [];
      let dataPoints = [];
      
      for(let i = 1; i <= daysInMonth; i++) {
        labels.push(i);
        dataPoints.push(dataObj[i] || 0); // Jika tgl tsb tidak ada data, isi 0
      }

      // Membuat gradient area
      let gradient = ctx.createLinearGradient(0, 0, 0, 400);
      gradient.addColorStop(0, 'rgba(14, 165, 233, 0.4)');
      gradient.addColorStop(1, 'rgba(14, 165, 233, 0)');

      myChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Pendapatan (Rp)',
            data: dataPoints,
            borderColor: '#0ea5e9',
            backgroundColor: gradient,
            borderWidth: 3,
            pointBackgroundColor: '#fff',
            pointBorderColor: '#0ea5e9',
            pointRadius: 4,
            fill: true,
            tension: 0.4 // Membuat garis kurva melengkung
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false } },
            y: { grid: { borderDash: [5, 5] }, beginAtZero: true }
          }
        }
      });
    }

    // --- MENU 3: MAINTENANCE ---
    function calcTotal() {
      const price = document.getElementById('mPrice').value || 0;
      const qty = document.getElementById('mQty').value || 0;
      const total = price * qty;
      document.getElementById('mTotalDisplay').innerText = formatRp(total);
      document.getElementById('mTotalValue').value = total;
    }

    function submitMaintenance(e) {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Menyimpan...`;
      
      const v = id => document.getElementById(id).value;
      google.script.run.withSuccessHandler(res => {
        btn.innerHTML = `<i class="fas fa-clipboard-check"></i> Simpan Anggaran`;
        alert(res.message);
        e.target.reset();
        calcTotal();
      }).addMaintenance(currentUser.userId, v('mRoom'), v('mMaterial'), v('mPrice'), v('mQty'), v('mTotalValue'));
    }

    // --- MENU 4: ACCOUNT ---
    function updateAccount(e) {
      e.preventDefault();
      const u = document.getElementById('accUser').value;
      const p = document.getElementById('accPass').value;
      if(!u && !p) return alert("Tidak ada data yang diubah.");
      
      google.script.run.withSuccessHandler(res => {
        alert(res.message);
        if(res.success) {
          currentUser.username = res.newUsername || currentUser.username;
          document.getElementById('displayUser').innerText = currentUser.username;
          document.getElementById('accPass').value = ''; // Reset form password
        }
      }).updateAccount(currentUser.userId, u, p);
    }
  </script>
</body>
</html>
